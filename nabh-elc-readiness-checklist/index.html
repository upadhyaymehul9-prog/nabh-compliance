    ["How is this readiness score calculated?","Each question scores Yes = 1, Partially = 0.5, No = 0. Your percentage score maps to one of four bands: Not Ready (under 40%), Early Stage (40–60%), On Track (60–80%), or Likely Ready (over 80%, subject to document verification during the actual assessment)."],

  ];

  var TOTAL_Q = CHAPTERS.reduce(function(n,c){return n+c.questions.length;},0);

  var screening = { programme:"", cycle:"" };
  var answers = new Array(TOTAL_Q).fill(null);
  var step = 0; // 0 = screening, 1..10 = chapters, 11 = results

  function qGlobalIndex(chapterIdx, qIdx){
    var n = 0;
    for(var i=0;i<chapterIdx;i++) n += CHAPTERS[i].questions.length;
    return n + qIdx;
  }

  function unansweredInChapter(chapterIdx){
    var missing = [];
    CHAPTERS[chapterIdx].questions.forEach(function(q, qIdx){
      var gIdx = qGlobalIndex(chapterIdx, qIdx);
      if(!answers[gIdx]) missing.push(gIdx);
    });
    return missing;
  }

  function scoreAnswer(v){
    if(v==="yes") return 1;
    if(v==="partial") return 0.5;
    if(v==="no") return 0;
    return null; // n/a or unanswered - excluded
  }

  function computeResult(){
    var sum=0, count=0;
    for(var i=0;i<TOTAL_Q;i++){
      var s = scoreAnswer(answers[i]);
      if(s!==null){ sum+=s; count++; }
    }
    var pct = count>0 ? (sum/count*100) : 0;
    var band;
    if(pct<40) band={label:"Not Ready",color:"var(--red)"};
    else if(pct<60) band={label:"Early Stage",color:"var(--amber)"};
    else if(pct<80) band={label:"On Track",color:"var(--blue)"};
    else band={label:"Likely Ready (subject to document verification)",color:"var(--green)"};
    return { pct:pct, band:band, count:count };
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){
      if(k==="html") e.innerHTML = attrs[k];
      else if(k.indexOf("on")===0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }

    card.appendChild(el("label",{class:"field",html:"Programme applying for"}));

  function renderChapter(container, chapterIdx){

    container.appendChild(el("div",{class:"progress-outer"},[el("div",{class:"progress-inner",style:"width:"+pctDone+"%"})]));
    container.appendChild(el("div",{class:"progress-label",html:"Chapter "+(chapterIdx+1)+" of 10"}));

    var card = el("div",{class:"card"});
    card.appendChild(el("div",{class:"chapter-title",html:chapter.name}));
    card.appendChild(el("div",{class:"chapter-code",html:chapter.code}));

    var errorMsg = el("div",{class:"error-msg",style:"display:none;"});

    chapter.questions.forEach(function(q, qIdx){
      var gIdx = qGlobalIndex(chapterIdx, qIdx);
      var qWrap = el("div",{class:"q"});
      var textRow = el("div",{class:"q-text"},[
        document.createTextNode((gIdx+1)+". "+q[0])
      ]);
      if(q[1]) textRow.appendChild(el("span",{class:"core-badge",title:"Core — required for ELC certification",html:"Core"}));
      qWrap.appendChild(textRow);

      var opts = el("div",{class:"opts"});
      [["yes","Yes"],["partial","Partially"],["no","No"],["na","N/A"]].forEach(function(o){
        var inputId = "q"+gIdx+"_"+o[0];
        var radio = el("input",{type:"radio",name:"q"+gIdx,id:inputId,value:o[0],onchange:function(){
          answers[gIdx]=o[0];
          qWrap.classList.remove("q-error");
          if(errorMsg.style.display!=="none" && unansweredInChapter(chapterIdx).length===0){
            errorMsg.style.display = "none";
          }
        }});
        if(answers[gIdx]===o[0]) radio.checked = true;
        var label = el("label",{for:inputId,html:o[1]});
        opts.appendChild(el("div",{class:"opt"},[radio,label]));
      });
      qWrap.appendChild(opts);
      card.appendChild(qWrap);
    });

    card.appendChild(errorMsg);

    var nav = el("div",{class:"nav-row"},[
      el("button",{class:"btn-ghost",onclick:function(){ step=chapterIdx; render(); }},[document.createTextNode("← Back")]),
      el("button",{class:"btn-primary",onclick:function(){
        var missing = unansweredInChapter(chapterIdx);
        if(missing.length>0){
          missing.forEach(function(gIdx){
            var wrap = card.querySelectorAll(".q")[gIdx - qGlobalIndex(chapterIdx,0)];
            if(wrap) wrap.classList.add("q-error");
          });
          errorMsg.textContent = "Please answer all questions before continuing — " + missing.length + " question" + (missing.length>1?"s":"") + " left blank.";
          errorMsg.style.display = "block";
          var firstWrap = card.querySelectorAll(".q")[missing[0] - qGlobalIndex(chapterIdx,0)];
          if(firstWrap) firstWrap.scrollIntoView({behavior:"smooth", block:"center"});
          return;
        }
        step=chapterIdx+2; render();
      }},[
        document.createTextNode(chapterIdx===9 ? "See My Score →" : "Next →")
      ])
    ]);
    card.appendChild(nav);
    container.appendChild(card);
  }

  function chapterResult(chapterIdx){
    var sum=0, count=0;
    CHAPTERS[chapterIdx].questions.forEach(function(q, qIdx){
      var s = scoreAnswer(answers[qGlobalIndex(chapterIdx, qIdx)]);
      if(s!==null){ sum+=s; count++; }
    });
    return { pct: count>0 ? (sum/count*100) : 0, count: count };
  }

  var ANSWER_LABELS = { yes:"Yes", partial:"Partially", no:"No", na:"N/A" };

  function generatePdf(meta, result){
    if(!window.jspdf){ console.error("[ELC checklist] jsPDF failed to load; skipping PDF generation."); return; }
    var doc = new window.jspdf.jsPDF();
    var pageHeight = doc.internal.pageSize.getHeight();
    var marginBottom = 15;
    var y = 18;

    function ensureSpace(lineCount, lineHeight){
      if(y + lineCount*lineHeight > pageHeight - marginBottom){ doc.addPage(); y = 18; }
    }

    doc.setFontSize(16);
    doc.text("NABH ELC Readiness Report", 14, y); y += 9;
    doc.setFontSize(10);
    doc.text("Hospital: " + meta.hospitalName, 14, y); y += 6;
    doc.text("Programme: " + (PROGRAMME_LABELS[meta.programme] || "-") + "   |   " + (CYCLE_LABELS[meta.cycle] || "-"), 14, y); y += 8;
    doc.setFontSize(13);
    doc.text("Overall score: " + Math.round(result.pct) + "%  —  " + result.band.label, 14, y); y += 10;

    CHAPTERS.forEach(function(chapter, cIdx){
      var chResult = chapterResult(cIdx);
      ensureSpace(2, 6);
      doc.setFontSize(12);
      doc.setFont(undefined, "bold");
      doc.text(chapter.code + " - " + chapter.name + " (" + Math.round(chResult.pct) + "%)", 14, y);
      doc.setFont(undefined, "normal");
      y += 7;
      doc.setFontSize(9);

      chapter.questions.forEach(function(q, qIdx){
        var gIdx = qGlobalIndex(cIdx, qIdx);
        var ansLabel = ANSWER_LABELS[answers[gIdx]] || "Not answered";
        var text = (gIdx+1) + ". " + q[0] + (q[1] ? " [Core]" : "") + " — " + ansLabel;
        var lines = doc.splitTextToSize(text, 180);
        ensureSpace(lines.length, 4.5);
        doc.text(lines, 14, y);
        y += lines.length*4.5;
      });
      y += 4;
    });

    doc.save("NABH-ELC-Readiness-Report.pdf");
  }

  function submitLead(meta, result){
    return fetch(SUPABASE_URL + "/rest/v1/elc_checklist_leads", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        name: meta.name,
        hospital_name: meta.hospitalName,
        email: meta.email,
        programme: screening.programme || null,
        cert_type: screening.cycle || null,
        readiness_score: Math.round(result.pct),
        readiness_band: result.band.label,
        answered_count: result.count,
        total_count: TOTAL_Q
      })
    });
  }

  function renderResults(container){
    var r = computeResult();
    var card = el("div",{class:"card"});
    card.appendChild(el("div",{class:"eyebrow",html:"Your Result"}));
    card.appendChild(el("div",{class:"result-score",html:Math.round(r.pct)+"%"}));
    card.appendChild(el("div",{class:"result-band",style:"background:"+r.band.color+"22;color:"+r.band.color+";border:1px solid "+r.band.color+"55;",html:r.band.label}));
    card.appendChild(el("div",{class:"result-note",html:"Based on "+r.count+" answered questions (N/A and skipped questions are excluded from scoring)."}));
    container.appendChild(card);

    var pdfCard = el("div",{class:"card"});
    pdfCard.appendChild(el("div",{style:"font-weight:700;margin-bottom:4px;",html:"Want the full breakdown?"}));
    pdfCard.appendChild(el("div",{class:"result-note",style:"margin-bottom:14px;",html:"Get a chapter-by-chapter PDF report showing exactly which items need work."}));
    var formWrap = el("div",{});
    var nameInput = el("input",{type:"text",required:"required",placeholder:"Your name"});
    var hospitalInput = el("input",{type:"text",required:"required",placeholder:"Hospital name"});
    var emailInput = el("input",{type:"email",required:"required",placeholder:"you@hospital.com"});
    var submitBtn = el("button",{type:"submit",class:"btn-primary pdf-btn",html:"Get detailed PDF report"});

    var form = el("form",{onsubmit:function(e){
      e.preventDefault();
      var meta = { name:nameInput.value, hospitalName:hospitalInput.value, email:emailInput.value, programme:screening.programme, cycle:screening.cycle };
      submitBtn.setAttribute("disabled","disabled");
      submitBtn.textContent = "Generating report…";

      submitLead(meta, r).then(function(res){
        if(!res.ok) return res.text().then(function(body){ throw new Error("Supabase insert failed: "+res.status+" "+body); });
      }).catch(function(err){
        console.error("[ELC checklist] lead insert failed", err);
      }).then(function(){
        generatePdf(meta, r);
        formWrap.innerHTML = "";
        formWrap.appendChild(el("div",{class:"result-note",style:"color:var(--green);",html:"Your PDF report has downloaded. Thanks, "+meta.name+"!"}));
      });
    }});
    form.appendChild(el("label",{class:"field",html:"Name"}));
    form.appendChild(nameInput);
    form.appendChild(el("label",{class:"field",html:"Hospital name"}));
    form.appendChild(hospitalInput);
    form.appendChild(el("label",{class:"field",html:"Email address"}));
    form.appendChild(emailInput);
    form.appendChild(submitBtn);
    formWrap.appendChild(form);
    pdfCard.appendChild(formWrap);
    container.appendChild(pdfCard);

    var again = el("div",{class:"nav-row"},[
      el("button",{class:"btn-ghost",onclick:function(){ step=10; render(); }},[document.createTextNode("← Back")]),
      el("span",{})
    ]);
    container.appendChild(again);
  }

  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";
    if(step===0) renderScreening(app);
    else if(step>=1 && step<=10) renderChapter(app, step-1);
    else renderResults(app);
    window.scrollTo(0,0);
  }

  function renderFaqs(){
    var list = document.getElementById("faq-list");
    FAQS.forEach(function(f){
      list.appendChild(el("div",{class:"faq-item"},[
        el("div",{class:"faq-q",html:f[0]}),
        el("div",{class:"faq-a",html:f[1]})
      ]));
    });
  }

  render();
  renderFaqs();
})();
</script>
</body>
